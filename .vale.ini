StylesPath = .vale/styles
Vocab = Powerbouwer

MinAlertLevel = suggestion

Packages = Microsoft

# Preserve non-prose issue URLs in YAML front matter.
IgnoredScopes = code, tt, kbd, samp, text.frontmatter.issueUrl

# VitePress documentation files.
[docs/**/*.md]
BasedOnStyles = Vale, Microsoft, Powerbouwer

Microsoft.Acronyms = NO
Powerbouwer.Acronyms = suggestion