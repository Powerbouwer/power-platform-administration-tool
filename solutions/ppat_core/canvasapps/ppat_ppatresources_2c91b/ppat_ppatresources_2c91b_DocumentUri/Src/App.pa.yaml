App:
  Properties:
    Formulas: "=// Defines shared visual settings for the app, including colors, typography, corner radius, and drop shadow.\r\n\r\n    AppTheme = { \r\n        Color: {\r\n            Background: ColorValue(\"#fafafa\"), \r\n            Section: ColorValue(\"#ffffff\")\r\n        },\r\n        Font: Font.'Segoe UI', \r\n        FontSize: {\r\n            regular: 14, \r\n            header: 20\r\n        }, \r\n        BorderRadius: 8,\r\n        DropShadow: DropShadow.Semilight\r\n        \r\n    };\r\n\r\n// Defines the page name and ribbon configuration. Each ribbon action has an enabled flag and tooltip text. These settings configure controls that reference them; they do not implement the actions themselves.\r\n\r\n    AppSettings = {\r\n        pageName: \"Cloud Flows\",\r\n        pageRibbon: {\r\n            \r\n            // Ribbon settings for the inventory view.\r\n            View: {\r\n                back: {\r\n                    enabled: true,\r\n                    tooltip: \"Back\"\r\n                }, \r\n                refresh: {\r\n                    enabled: true, \r\n                    tooltip: \"Refresh data\"\r\n                },\r\n                quickview: { \r\n                    enabled: true, \r\n                    tooltip: \"Toggle Quick View pane\"\r\n                }\r\n\r\n            },\r\n\r\n            // Ribbon settings for the inventory record form.\r\n            Form: {\r\n                back: {\r\n                    enabled: true,\r\n                    tooltip: \"Back\"\r\n                },\r\n                environment: {\r\n                    enabled: true,\r\n                    tooltip: \"Go to Environment\"\r\n                }\r\n            }\r\n        }\r\n    };\r\n\r\n\r\n\r\n// Crete a list of all Resource Types include proper Type Value per resource type\r\n    nfResourceTypes =\r\n        Table(\r\n            {ResourceType: \"Canvas apps\", TypeValue: \"microsoft.powerapps/canvasapps\"},\r\n            {ResourceType: \"Model-driven apps\", TypeValue: \"microsoft.powerapps/modeldrivenapps\"},\r\n            {ResourceType: \"Code apps\", TypeValue: \"microsoft.powerapps/codeapps\"},\r\n            {ResourceType: \"Managed apps\", TypeValue: \"microsoft.powerapps/apps\"},\r\n            {ResourceType: \"Cloud flows\", TypeValue: \"microsoft.powerautomate/cloudflows\"},\r\n            {ResourceType: \"Agent flows\", TypeValue: \"microsoft.powerautomate/agentflows\"},\r\n            {ResourceType: \"Workflow agent flows\", TypeValue: \"microsoft.powerautomate/m365agentflows\"},\r\n            {ResourceType: \"Copilot Studio agents\", TypeValue: \"microsoft.copilotstudio/agents\"},\r\n            {ResourceType: \"Power Pages sites\", TypeValue: \"microsoft.powerpages/sites\"},\r\n            {ResourceType: \"Connectors\", TypeValue: \"microsoft.powerplatformconnector/connectors\"},\r\n            {ResourceType: \"Environments\", TypeValue: \"microsoft.powerplatform/environments\"},\r\n            {ResourceType: \"Environment groups\", TypeValue: \"microsoft.powerplatform/environmentgroups\"}\r\n        );\r\n\r\n\r\n\r\n\r\nnfInventoryQueries = 'Inventory Queries';\r\n\r\n// Defines the type of a single connector operation.\r\n\r\n    InventoryOperationType := Type(\r\n        {\r\n            operationId: Text\r\n        }\r\n    );\r\n\r\n// Defines the type of a connector, including its identifier, display name, and table of operations.\r\n\r\n    InventoryConnectorType := Type(\r\n        {\r\n            connectorId: Text,\r\n            connectorDisplayName: Text,\r\n            operations: [InventoryOperationType]\r\n        }\r\n    );\r\n\r\n// Defines the type of a flow trigger, including its operation and the connector associated with that operation.\r\n\r\n    InventoryTriggerType := Type(\r\n        {\r\n            operationId: Text,\r\n            connectorId: Text,\r\n            connectorDisplayName: Text,\r\n            operationDisplayName: Text\r\n        }\r\n    );\r\n\r\n// Defines the type of the nested properties record, including connector usage, flow metadata, ownership, timestamps, trigger details, and status.\r\n\r\n    InventoryPropertiesType := Type(\r\n        {\r\n            powerPlatformConnectors: [InventoryConnectorType],\r\n            displayName: Text,\r\n            environmentId: Hyperlink,\r\n            createdBy: Text,\r\n            createdByUser: Text,\r\n            createdAt: DateTime,\r\n            lastModifiedAt: DateTime,\r\n            ownerId: Text,\r\n            ownerIdUser: Text,\r\n            lastModifiedBy: Text,\r\n            workflowEntityId: Text,\r\n            flowTriggerType: Text,\r\n            trigger: InventoryTriggerType,\r\n            status: Text\r\n        }\r\n    );\r\n\r\n// Defines the type of a complete inventory resource, combining resource-level metadata with its nested properties.\r\n\r\n    InventoryResourceType := Type(\r\n        {\r\n            id: Text,\r\n            name: Text,\r\n            type: Text,\r\n            tenantId: Text,\r\n            kind: Text,\r\n            location: Text,\r\n            resourceGroup: Text,\r\n            subscriptionId: Text,\r\n            managedBy: Text,\r\n            properties: InventoryPropertiesType\r\n        }\r\n    );\r\n\r\n// Defines a table type whose rows use InventoryResourceType.\r\n    \r\n    InventoryTableType := Type([InventoryResourceType]);\r\n\r\n// Parses JSON text into the declared inventory table type. The JSON is expected to contain an array matching that schema.\r\n\r\n    ParseInventory(jsonText: Text): InventoryTableType =\r\n        ParseJSON(jsonText, InventoryTableType);\r\n\r\n// Creates a named formula that transforms varInventory into a table with flattened resource, property, and trigger fields. The connector table is retained, while additional fields provide comma-separated connector identifiers and names, connector counts, and a total operation count across all connectors. As a named formula, nfInventory is recalculated as needed when its dependencies change; it does not populate a separate collection. \r\n\r\n    nfInventory =\r\n        ForAll(\r\n            varInventory As resource,\r\n            {\r\n\r\n                // Copies the shared resource-level metadata.\r\n                \r\n                    id: resource.id,\r\n                    name: resource.name,\r\n                    type: resource.type,\r\n                    tenantId: resource.tenantId,\r\n                    kind: resource.kind,\r\n                    location: resource.location,\r\n                    resourceGroup: resource.resourceGroup,\r\n                    subscriptionId: resource.subscriptionId,\r\n                    managedBy: resource.managedBy,\r\n\r\n                // Flattens the nested properties into top-level fields. The User-suffixed fields currently copy createdBy and ownerId; they do not resolve user names or use the corresponding User fields.\r\n\r\n                    propDisplayName: resource.properties.displayName,\r\n                    propEnvironmentId: resource.properties.environmentId,\r\n                    propCreatedBy: resource.properties.createdBy,\r\n                    propCreatedByUser: resource.properties.createdBy,\r\n                    propCreatedAt: resource.properties.createdAt,\r\n                    propLastModifiedAt: resource.properties.lastModifiedAt,\r\n                    propOwnerId: resource.properties.ownerId,\r\n                    propOwnerIdUser: resource.properties.ownerId,\r\n                    propLastModifiedBy: resource.properties.lastModifiedBy,\r\n                    propWorkflowEntityId: resource.properties.workflowEntityId,\r\n                    propFlowTriggerType: resource.properties.flowTriggerType,\r\n                    propStatus: resource.properties.status,\r\n\r\n                // Flattens the trigger details. Counts the trigger as 1 when its operationId is not blank, otherwise as 0; this does not count multiple triggers.\r\n\r\n                    triggerOperationId: resource.properties.trigger.operationId,\r\n                    triggerConnectorId: resource.properties.trigger.connectorId,\r\n                    triggerConnectorDisplayName: resource.properties.trigger.connectorDisplayName,\r\n                    triggerOperationDisplayName: resource.properties.trigger.operationDisplayName,\r\n                    triggerCount: If(IsBlank(resource.properties.trigger.operationId), 0, 1),\r\n\r\n                // Retains the connector table and creates comma-separated lists of connector identifiers and display names. Counts connector rows and sums the number of operation rows across all connectors, without deduplicating them.\r\n\r\n                    connectors: resource.properties.powerPlatformConnectors,\r\n                    connectorIds: Concat(resource.properties.powerPlatformConnectors, connectorId, \", \"),\r\n                    connectorNames: Concat(resource.properties.powerPlatformConnectors, connectorDisplayName, \", \"),\r\n                    connectorCount: CountRows(resource.properties.powerPlatformConnectors),\r\n                    operationCount: Sum(\r\n                        resource.properties.powerPlatformConnectors,\r\n                        CountRows(operations)\r\n                    )\r\n\r\n            }\r\n        );\r\n\r\n\r\n\r\nnfInventoryColumns =\r\n    Table(\r\n        {\r\n            order: 1,\r\n            section: \"General\",\r\n            column: \"propDisplayName\",\r\n            displayname: \"Display Name\",\r\n            visible: true,\r\n            width: 300,\r\n            enabled: true,\r\n            tooltip: \"Display Name\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Display Name\",\r\n            FieldName: \"propDisplayName\",\r\n            ExtendExpression: \"tostring(properties.displayName)\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 2,\r\n            section: \"General\",\r\n            column: \"propStatus\",\r\n            displayname: \"Status\",\r\n            visible: true,\r\n            width: 120,\r\n            enabled: true,\r\n            tooltip: \"Status\",\r\n            fieldtype: \"LookUp\",\r\n\r\n            DisplayName: \"Status\",\r\n            FieldName: \"propStatus\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 4,\r\n            section: \"General\",\r\n            column: \"propCreatedBy\",\r\n            displayname: \"Created By\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Created By\",\r\n            fieldtype: \"DateTime\",\r\n\r\n            DisplayName: \"Created By\",\r\n            FieldName: \"propCreatedBy\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 5,\r\n            section: \"General\",\r\n            column: \"propLastModifiedBy\",\r\n            displayname: \"Last Modified By\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Last Modified By\",\r\n            fieldtype: \"LookUp\",\r\n            related: nfInventoryDataUsers,\r\n\r\n            DisplayName: \"Last Modified By\",\r\n            FieldName: \"propLastModifiedBy\",\r\n            ExtendExpression: \"tostring(properties.lastModifiedBy)\",\r\n            FieldType: \"LookUp\"\r\n        },\r\n        {\r\n            order: 6,\r\n            section: \"General\",\r\n            column: \"propLastModifiedAt\",\r\n            displayname: \"Last Modified At\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Last Modified At\",\r\n            fieldtype: \"DateTime\",\r\n\r\n            DisplayName: \"Last Modified At\",\r\n            FieldName: \"propLastModifiedAt\",\r\n            ExtendExpression: \"todatetime(properties.lastModifiedAt)\",\r\n            FieldType: \"DateTime\"\r\n        },\r\n        {\r\n            order: 8,\r\n            section: \"General\",\r\n            column: \"operationCount\",\r\n            displayname: \"Operations\",\r\n            visible: true,\r\n            width: 100,\r\n            enabled: true,\r\n            tooltip: \"Operations\",\r\n            fieldtype: \"Int\",\r\n\r\n            DisplayName: \"Operations\",\r\n            FieldName: \"operationCount\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"Int\"\r\n        },\r\n        {\r\n            order: 13,\r\n            section: \"General\",\r\n            column: \"propCreatedAt\",\r\n            displayname: \"Created At\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Created At\",\r\n            fieldtype: \"DateTime\",\r\n\r\n            DisplayName: \"Created At\",\r\n            FieldName: \"propCreatedAt\",\r\n            ExtendExpression: \"todatetime(properties.createdAt)\",\r\n            FieldType: \"DateTime\"\r\n        },\r\n        {\r\n            order: 14,\r\n            section: \"General\",\r\n            column: \"subscriptionId\",\r\n            displayname: \"Subscription Id\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Subscription Id\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Subscription Id\",\r\n            FieldName: \"subscriptionId\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 15,\r\n            section: \"General\",\r\n            column: \"propWorkflowEntityId\",\r\n            displayname: \"Workflow Entity Id\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Workflow Entity Id\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Workflow Entity Id\",\r\n            FieldName: \"propWorkflowEntityId\",\r\n            ExtendExpression: \"tostring(properties.workflowEntityId)\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 19,\r\n            section: \"General\",\r\n            column: \"propEnvironmentId\",\r\n            displayname: \"Environment Id\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Environment Id\",\r\n            fieldtype: \"LookUp\",\r\n            related: nfInventoryDataEnvironments,\r\n\r\n            DisplayName: \"Environment Id\",\r\n            FieldName: \"propEnvironmentId\",\r\n            ExtendExpression: \"tostring(properties.environmentId)\",\r\n            FieldType: \"LookUp\"\r\n        },\r\n        {\r\n            order: 23,\r\n            section: \"General\",\r\n            column: \"propOwnerId\",\r\n            displayname: \"Owner Id\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Owner Id\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Owner Id\",\r\n            FieldName: \"propOwnerId\",\r\n            ExtendExpression: \"tostring(properties.ownerId)\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 9,\r\n            section: \"Resource\",\r\n            column: \"type\",\r\n            displayname: \"Type\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Tooltip: type\",\r\n            fieldtype: \"LookUp\",\r\n\r\n            DisplayName: \"Type\",\r\n            FieldName: \"type\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 9,\r\n            section: \"Resource\",\r\n            column: \"resourceGroup\",\r\n            displayname: \"Resource Group\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Resource Group\",\r\n            fieldtype: \"LookUp\",\r\n\r\n            DisplayName: \"Resource Group\",\r\n            FieldName: \"resourceGroup\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 9,\r\n            section: \"Resource\",\r\n            column: \"tenantId\",\r\n            displayname: \"Tenant Id\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Tenant Id\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Tenant Id\",\r\n            FieldName: \"tenantId\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 9,\r\n            section: \"Resource\",\r\n            column: \"name\",\r\n            displayname: \"Name\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Name\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Name\",\r\n            FieldName: \"name\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 9,\r\n            section: \"Resource\",\r\n            column: \"managedBy\",\r\n            displayname: \"Managed By\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Managed By\",\r\n            fieldtype: \"LookUp\",\r\n\r\n            DisplayName: \"Managed By\",\r\n            FieldName: \"managedBy\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 9,\r\n            section: \"Resource\",\r\n            column: \"location\",\r\n            displayname: \"Location\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Location\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Location\",\r\n            FieldName: \"location\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 9,\r\n            section: \"Resource\",\r\n            column: \"kind\",\r\n            displayname: \"Kind\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Kind\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Kind\",\r\n            FieldName: \"kind\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 9,\r\n            section: \"Resource\",\r\n            column: \"id\",\r\n            displayname: \"Id\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Id (resource)\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Id\",\r\n            FieldName: \"id\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 7,\r\n            section: \"Connector\",\r\n            column: \"connectorCount\",\r\n            displayname: \"Connectors\",\r\n            visible: true,\r\n            width: 100,\r\n            enabled: true,\r\n            tooltip: \"Connectors\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Connectors\",\r\n            FieldName: \"connectorCount\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"Int\"\r\n        },\r\n        {\r\n            order: 9,\r\n            section: \"Connector\",\r\n            column: \"connectors\",\r\n            displayname: \"Connectors\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Connectors\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Connectors\",\r\n            FieldName: \"connectors\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 10,\r\n            section: \"Connector\",\r\n            column: \"connectorIds\",\r\n            displayname: \"Connector Id's\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Connector Id's\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Connector Id's\",\r\n            FieldName: \"connectorIds\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 3,\r\n            section: \"Triggers\",\r\n            column: \"propFlowTriggerType\",\r\n            displayname: \"Flow Trigger Type\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Flow Trigger Type\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Flow Trigger Type\",\r\n            FieldName: \"propFlowTriggerType\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 24,\r\n            section: \"Triggers\",\r\n            column: \"triggerConnectorDisplayName\",\r\n            displayname: \"Connector Display Name (Trigger)\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Connector Display Name (Trigger)\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Connector Display Name (Trigger)\",\r\n            FieldName: \"triggerConnectorDisplayName\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 25,\r\n            section: \"Triggers\",\r\n            column: \"triggerConnectorId\",\r\n            displayname: \"Connector Id (Trigger)\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Connector Id (Trigger)\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Connector Id (Trigger)\",\r\n            FieldName: \"triggerConnectorId\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 26,\r\n            section: \"Triggers\",\r\n            column: \"triggerCount\",\r\n            displayname: \"Count (Trigger)\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Count (Trigger)\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Count (Trigger)\",\r\n            FieldName: \"triggerCount\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"Int\"\r\n        },\r\n        {\r\n            order: 27,\r\n            section: \"Triggers\",\r\n            column: \"triggerOperationDisplayName\",\r\n            displayname: \"Operation DisplayName (Trigger)\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Operation DisplayName (Trigger)\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Operation DisplayName (Trigger)\",\r\n            FieldName: \"triggerOperationDisplayName\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        },\r\n        {\r\n            order: 28,\r\n            section: \"Triggers\",\r\n            column: \"triggerOperationId\",\r\n            displayname: \"Operation Id (Trigger)\",\r\n            visible: true,\r\n            width: 170,\r\n            enabled: true,\r\n            tooltip: \"Operation Id (Trigger)\",\r\n            fieldtype: \"String\",\r\n\r\n            DisplayName: \"Operation Id (Trigger)\",\r\n            FieldName: \"triggerOperationId\",\r\n            ExtendExpression: \"\",\r\n            FieldType: \"String\"\r\n        }\r\n    );\r\n\r\n\r\n\r\n// Temporary tables (collections)\r\n\r\n    nfInventoryDataEnvironments = \r\n        Table(\r\n            {\r\n                id: GUID(), \r\n                DisplayName: \"rsdk-dev\"\r\n            },\r\n            {\r\n                id: GUID(), \r\n                DisplayName: \"rsdk-preview\"\r\n            }            \r\n        );\r\n\r\n    nfInventoryDataUsers = \r\n        Table(\r\n            {\r\n                id: GUID(), \r\n                DisplayName: \"Arjan Rijsdijk\"\r\n            },\r\n            {\r\n                id: GUID(), \r\n                DisplayName: \"Peter Playwright\"\r\n            }            \r\n        );\r\n\r\n\r\n// Typeing for colInventoryFilter\r\n\r\nFilterType := Type([\r\n    {\r\n        enabled: Boolean,\r\n        id: Text,\r\n        value: Text,\r\n        field: {\r\n            DisplayName: Text,\r\n            ExtendExpression: Text,\r\n            FieldName: Text,\r\n            FieldType: Text,\r\n            column: Text,\r\n            displayname: Text,\r\n            enabled: Boolean,\r\n            fieldtype: Text,\r\n            order: Number,\r\n            section: Text,\r\n            tooltip: Text,\r\n            visible: Boolean,\r\n            width: Number\r\n        },\r\n        operator: {\r\n            DisplayOrder: Number,\r\n            Displayname: Text,\r\n            FieldTypes: [{ Value: Text }],\r\n            Operator: Text,\r\n            QueryOperator: Text\r\n        }\r\n    }\r\n]);\r\n\r\n\r\n\r\n\r\n/* Qury Buider functions */\r\n\r\n// Invalidates previous results before building a new query.\r\nudfQbReset(): Void = {\r\n    Set(varQbReady, false);\r\n    Set(varQbRawJson, Blank());\r\n    Set(varQbClausesJson, Blank());\r\n    Set(varQbKql, Blank());\r\n    Set(varQbSnapshot, Blank());\r\n    Set(varQbToday, Blank());\r\n    Set(varQbRules, Blank());\r\n    Set(varQbExtends, Blank());\r\n    Set(varQbRulesError, false);\r\n    Set(varQbExtendsError, false);\r\n    Set(varQbTermsError, false)\r\n};\r\n\r\n// Includes the required resource type and all UI rules in the internal snapshot.\r\n    udfQbGetRawJson(): Text =\r\n        JSON(\r\n            {\r\n                ResourceType: varResourceType,\r\n                Filters: ForAll(\r\n                    colInventoryFilter As f,\r\n                    {\r\n                        Id: Text(f.id),\r\n                        FieldName: f.field.FieldName,\r\n                        FieldType: f.field.FieldType,\r\n                        Operator: f.operator.Operator,\r\n                        Value: f.value,\r\n                        Enabled: f.enabled\r\n                    }\r\n                )\r\n            },\r\n            JSONFormat.Compact\r\n        );\r\n\r\n// Creates a validated internal table from the enabled rules.\r\nudfQbValidateRules(): Boolean = {\r\n    Set(varQbRulesError, false);\r\n    Set(\r\n        varQbRules,\r\n        IfError(\r\n            ForAll(\r\n                Filter(colInventoryFilter, enabled) As f,\r\n                With(\r\n                    {\r\n                        fld: LookUp(\r\n                            colInventoryColumns As c,\r\n                            c.FieldName = f.field.FieldName\r\n                        ),\r\n                        op: LookUp(\r\n                            colInventoryOperators As o,\r\n                            o.Operator = f.operator.Operator\r\n                        ),\r\n                        parsedDate: IfError(\r\n                            DateValue(f.value, \"en-US\"),\r\n                            Blank()\r\n                        )\r\n                    },\r\n                    {\r\n                        Id: f.id,\r\n                        FieldName: fld.FieldName,\r\n                        FieldType: fld.FieldType,\r\n                        Operator: op.Operator,\r\n                        QueryOperator: op.QueryOperator,\r\n                        RawValue: f.value,\r\n                        Day: If(\r\n                            fld.FieldType = \"DateTime\",\r\n                            Switch(\r\n                                op.Operator,\r\n                                \"Yesterday\", DateAdd(varQbToday, -1, TimeUnit.Days),\r\n                                \"Today\", varQbToday,\r\n                                \"Tomorrow\", DateAdd(varQbToday, 1, TimeUnit.Days),\r\n                                parsedDate\r\n                            ),\r\n                            Blank()\r\n                        ),\r\n                        Valid:\r\n                            !IsBlank(fld.FieldName) &&\r\n                            !IsBlank(op.Operator) &&\r\n                            fld.FieldType in op.FieldTypes &&\r\n                            If(\r\n                                fld.FieldType = \"DateTime\",\r\n                                op.Operator in [\r\n                                    \"On\",\r\n                                    \"OnOrAfter\",\r\n                                    \"OnOrBefore\",\r\n                                    \"Yesterday\",\r\n                                    \"Today\",\r\n                                    \"Tomorrow\"\r\n                                ] &&\r\n                                (\r\n                                    op.Operator in [\r\n                                        \"Yesterday\",\r\n                                        \"Today\",\r\n                                        \"Tomorrow\"\r\n                                    ] ||\r\n                                    (\r\n                                        !IsBlank(parsedDate) &&\r\n                                        Text(\r\n                                            parsedDate,\r\n                                            \"yyyy-mm-dd\",\r\n                                            \"en-US\"\r\n                                        ) = f.value\r\n                                    )\r\n                                ),\r\n                                fld.FieldType in [\"String\", \"LookUp\"] &&\r\n                                !IsBlank(Trim(f.value)) &&\r\n                                !IsMatch(\r\n                                    f.value,\r\n                                    \"[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F]\",\r\n                                    MatchOptions.Contains\r\n                                ) &&\r\n                                op.QueryOperator in [\r\n                                    \"==\",\r\n                                    \"!=\",\r\n                                    \"contains\",\r\n                                    \"!contains\",\r\n                                    \"startswith\",\r\n                                    \"!startswith\",\r\n                                    \"endswith\",\r\n                                    \"!endswith\"\r\n                                ]\r\n                            )\r\n                    }\r\n                )\r\n            ),\r\n            Set(varQbRulesError, true);\r\n            Notify(\r\n                \"Processing filter rules failed: \" & FirstError.Message,\r\n                NotificationType.Error\r\n            );\r\n            Blank()\r\n        )\r\n    );\r\n\r\n    // Requires a supported resource type; additional UI filters are optional.\r\n    If(\r\n        IsBlank(varResourceType) ||\r\n        IsBlank(\r\n            LookUp(\r\n                nfResourceTypes As resource,\r\n                resource.TypeValue = varResourceType\r\n            )\r\n        ),\r\n        Notify(\r\n            \"A supported resource type is required.\",\r\n            NotificationType.Error\r\n        );\r\n        false,\r\n\r\n        varQbRulesError,\r\n        false,\r\n\r\n        !IsEmpty(Filter(varQbRules, !Valid)),\r\n        Notify(\r\n            \"Check the field, operator, and value of each enabled filter.\",\r\n            NotificationType.Error\r\n        );\r\n        false,\r\n\r\n        true\r\n    )\r\n        \r\n};\r\n\r\n\r\n// Selects only the calculated fields required by the enabled filters.\r\nudfQbBuildExtends(): Boolean = {\r\n    Set(varQbExtendsError, false);\r\n    IfError(\r\n        Set(\r\n            varQbExtends,\r\n            ForAll(\r\n                Filter(\r\n                    colInventoryColumns As column,\r\n                    !IsBlank(column.ExtendExpression) &&\r\n                    !IsBlank(\r\n                        LookUp(\r\n                            varQbRules As r,\r\n                            r.FieldName = column.FieldName\r\n                        )\r\n                    )\r\n                ) As selectedColumn,\r\n                {\r\n                    FieldName: selectedColumn.FieldName,\r\n                    Expression: selectedColumn.ExtendExpression\r\n                }\r\n            )\r\n        ),\r\n        Set(varQbExtendsError, true);\r\n        Notify(\r\n            \"Processing field expressions failed: \" & FirstError.Message,\r\n            NotificationType.Error\r\n        )\r\n    );\r\n\r\n    !varQbExtendsError\r\n};\r\n\r\n// Creates where terms; date filters use UTC boundaries for a full local day.\r\nudfQbBuildTerms(): Boolean = {\r\n    Set(varQbTermsError, false);\r\n    IfError(\r\n        ClearCollect(\r\n            colQbTerms,\r\n            Filter(\r\n                Table({\r\n                    FieldName: \"\",\r\n                    QueryOperator: \"\",\r\n                    ValueType: \"\",\r\n                    RawValue: \"\",\r\n                    KqlLiteral: \"\"\r\n                }),\r\n                false\r\n            )\r\n        );\r\n        ForAll(\r\n            varQbRules As r,\r\n            If(\r\n                r.FieldType = \"DateTime\",\r\n                With(\r\n                    {\r\n                        d0: r.Day,\r\n                        d1: DateAdd(r.Day, 1, TimeUnit.Days)\r\n                    },\r\n                    With(\r\n                        {\r\n                            t0: Text(d0, DateTimeFormat.UTC),\r\n                            t1: Text(d1, DateTimeFormat.UTC)\r\n                        },\r\n                        Switch(\r\n                            r.Operator,\r\n                            \"OnOrAfter\",\r\n                            Collect(\r\n                                colQbTerms,\r\n                                {\r\n                                    FieldName: r.FieldName,\r\n                                    QueryOperator: \">=\",\r\n                                    ValueType: \"DateTime\",\r\n                                    RawValue: t0,\r\n                                    KqlLiteral: \"datetime(\" & t0 & \")\"\r\n                                }\r\n                            ),\r\n                            \"OnOrBefore\",\r\n                            Collect(\r\n                                colQbTerms,\r\n                                {\r\n                                    FieldName: r.FieldName,\r\n                                    QueryOperator: \"<\",\r\n                                    ValueType: \"DateTime\",\r\n                                    RawValue: t1,\r\n                                    KqlLiteral: \"datetime(\" & t1 & \")\"\r\n                                }\r\n                            ),\r\n                            Collect(\r\n                                colQbTerms,\r\n                                {\r\n                                    FieldName: r.FieldName,\r\n                                    QueryOperator: \">=\",\r\n                                    ValueType: \"DateTime\",\r\n                                    RawValue: t0,\r\n                                    KqlLiteral: \"datetime(\" & t0 & \")\"\r\n                                },\r\n                                {\r\n                                    FieldName: r.FieldName,\r\n                                    QueryOperator: \"<\",\r\n                                    ValueType: \"DateTime\",\r\n                                    RawValue: t1,\r\n                                    KqlLiteral: \"datetime(\" & t1 & \")\"\r\n                                }\r\n                            )\r\n                        )\r\n                    )\r\n                ),\r\n                With(\r\n                    {\r\n                        encoded: JSON(\r\n                            r.RawValue,\r\n                            JSONFormat.Compact\r\n                        )\r\n                    },\r\n                    Collect(\r\n                        colQbTerms,\r\n                        {\r\n                            FieldName: r.FieldName,\r\n                            QueryOperator: r.QueryOperator,\r\n                            ValueType: \"String\",\r\n                            RawValue: r.RawValue,\r\n                            KqlLiteral:\r\n                                Char(39) &\r\n                                Substitute(\r\n                                    Substitute(\r\n                                        Mid(\r\n                                            encoded,\r\n                                            2,\r\n                                            Len(encoded) - 2\r\n                                        ),\r\n                                        Char(92) & Char(34),\r\n                                        Char(34)\r\n                                    ),\r\n                                    Char(39),\r\n                                    Char(92) & Char(39)\r\n                                ) &\r\n                                Char(39)\r\n                        }\r\n                    )\r\n                )\r\n            )\r\n        ),\r\n        Set(varQbTermsError, true);\r\n        Notify(\r\n            \"Building query terms failed: \" & FirstError.Message,\r\n            NotificationType.Error\r\n        )\r\n    );\r\n\r\n    // An empty terms collection is valid because the resource type is added separately.\r\n        !varQbTermsError\r\n\r\n};\r\n\r\n// Adds the required resource type before all optional query stages.\r\n// The resource type must first pass validation against nfResourceTypes.\r\n    udfQbBuildKql(): Text =\r\n        \"PowerPlatformResources\" &\r\n        Char(10) &\r\n        \"| where type == \" &\r\n        Char(39) & varResourceType & Char(39) &\r\n        Concat(\r\n            varQbExtends As e,\r\n            Char(10) &\r\n            \"| extend \" & e.FieldName & \" = \" & e.Expression\r\n        ) &\r\n        Concat(\r\n            colQbTerms As t,\r\n            Char(10) &\r\n            \"| where \" & t.FieldName & \" \" &\r\n            t.QueryOperator & \" \" & t.KqlLiteral\r\n        );\r\n\r\n// Adds the required resource type as the first inventory clause.\r\n// Optional clauses each include their own leading comma.\r\n    udfQbBuildClausesJson(): Text =\r\n        \"[\" &\r\n        JSON(\r\n            {\r\n                '$type': \"where\",\r\n                FieldName: \"type\",\r\n                Operator: \"==\",\r\n                Values: [Char(39) & varResourceType & Char(39)]\r\n            },\r\n            JSONFormat.FlattenValueTables\r\n        ) &\r\n        Concat(\r\n            varQbExtends As e,\r\n            \",\" &\r\n            JSON(\r\n                {\r\n                    '$type': \"extend\",\r\n                    FieldName: e.FieldName,\r\n                    Expression: e.Expression\r\n                },\r\n                JSONFormat.Compact\r\n            )\r\n        ) &\r\n        Concat(\r\n            colQbTerms As t,\r\n            \",\" &\r\n            JSON(\r\n                {\r\n                    '$type': \"where\",\r\n                    FieldName: t.FieldName,\r\n                    Operator: t.QueryOperator,\r\n                    Values: [t.KqlLiteral]\r\n                },\r\n                JSONFormat.FlattenValueTables\r\n            )\r\n        ) &\r\n        \"]\";\r\n\r\n// Runs all steps and sets Ready only when every output is available.\r\nudfQbBuildQuery(): Void = {\r\n    udfQbReset();\r\n    Set(varQbToday, Today());\r\n\r\n    If(\r\n        udfQbValidateRules() &&\r\n        udfQbBuildExtends() &&\r\n        udfQbBuildTerms(),\r\n\r\n        Set(\r\n            varQbRawJson,\r\n            IfError(\r\n                udfQbGetRawJson(),\r\n                Notify(\r\n                    \"Creating internal filter JSON failed: \" & FirstError.Message,\r\n                    NotificationType.Error\r\n                );\r\n                Blank()\r\n            )\r\n        );\r\n\r\n        Set(\r\n            varQbKql,\r\n            IfError(\r\n                udfQbBuildKql(),\r\n                Notify(\r\n                    \"Building KQL failed: \" & FirstError.Message,\r\n                    NotificationType.Error\r\n                );\r\n                Blank()\r\n            )\r\n        );\r\n\r\n        Set(\r\n            varQbClausesJson,\r\n            IfError(\r\n                udfQbBuildClausesJson(),\r\n                Notify(\r\n                    \"Building inventory clauses failed: \" & FirstError.Message,\r\n                    NotificationType.Error\r\n                );\r\n                Blank()\r\n            )\r\n        );\r\n\r\n        // The snapshot is the same internal JSON as the raw filter output.\r\n        Set(varQbSnapshot, varQbRawJson);\r\n\r\n        Set(\r\n            varQbReady,\r\n            !IsBlank(varQbRawJson) &&\r\n            !IsBlank(varQbKql) &&\r\n            !IsBlank(varQbClausesJson) &&\r\n            !IsBlank(varQbSnapshot)\r\n        );\r\n\r\n        // Clears partial query output if any output could not be created.\r\n        If(\r\n            !varQbReady,\r\n            Set(varQbKql, Blank());\r\n            Set(varQbClausesJson, Blank())\r\n        )\r\n    )\r\n};\r\n\r\n// Executes the previously built query and stores the response and inventory outputs.\r\n    udfQbRunInventory(): Void = {\r\n\r\n        // Start in a failed state and clear previous results to prevent stale output.\r\n        Set(varQbFlowFailed, true);\r\n        Set(varInventoryResponse, Blank());\r\n        Set(varInventory, Blank());\r\n        Set(varInventoryTotalRecords, Blank());\r\n        Set(varInventoryCount, Blank());\r\n        Set(varInventoryResultTruncated, Blank());\r\n\r\n        IfError(\r\n            With(\r\n                {\r\n                    currentSnapshot: udfQbGetRawJson()\r\n                },\r\n                If(\r\n\r\n                    // Reject missing, outdated, or incomplete query output.\r\n                    !varQbReady ||\r\n                    IsBlank(currentSnapshot) ||\r\n                    IsBlank(varQbSnapshot) ||\r\n                    IsBlank(varQbClausesJson) ||\r\n                    currentSnapshot <> varQbSnapshot ||\r\n                    varQbToday <> Today(),\r\n\r\n                    Set(varQbReady, false);\r\n                    Notify(\r\n                        \"The query is not ready, or the filters or calendar day have changed. Build the query again.\",\r\n                        NotificationType.Error\r\n                    );\r\n                    false,\r\n\r\n                    With(\r\n                        {\r\n                            // Call the flow once and retain its complete response.\r\n                            response: 'PPAT-SearchInventory'.Run(varQbClausesJson)\r\n                        },\r\n                        With(\r\n                            {\r\n                                // Parse all values before publishing the results.\r\n                                parsedInventory: ParseInventory(response.data),\r\n                                totalRecords: Value(response.totalrecords),\r\n                                recordCount: Value(response.count),\r\n                                resultTruncated: response.resulttruncated\r\n                            },\r\n                            Set(varInventoryResponse, response);\r\n                            Set(varInventory, parsedInventory);\r\n                            Set(varInventoryTotalRecords, totalRecords);\r\n                            Set(varInventoryCount, recordCount);\r\n                            Set(varInventoryResultTruncated, resultTruncated);\r\n\r\n                            // Mark the operation as successful only after processing completes.\r\n                            Set(varQbFlowFailed, false);\r\n                            true\r\n                        )\r\n                    )\r\n                )\r\n            ),\r\n\r\n            // Report errors from snapshot creation, the flow call, or response parsing.\r\n            Notify(\r\n                \"Running the inventory query or processing its response failed: \" &\r\n                FirstError.Message,\r\n                NotificationType.Error\r\n            );\r\n            false\r\n        )\r\n    };"
    OnStart: "=// Get the Resource Type from the URL (see Navigation URL in model-driven app navigation)\n\nWith(\n    { \n        resource: LookUp( nfResourceTypes, ResourceType = /*Cloud flows*/ Param(\"etn\") ) \n    },\n    \n    If(\n        IsBlank( /*Cloud flows*/Param(\"etn\") ),\n        Notify(\"The resource type parameter is missing.\", NotificationType.Warning),\n\n        IsBlank(resource),\n        Notify(\"The specified resource type was not found.\", NotificationType.Warning),\n\n        Set(varResourceType, resource.TypeValue);\n        Set(varResource, resource.ResourceType);\n        Set(\n        varResourceClause,\n            \"[\n                {\n                    \"\"$type\"\": \"\"where\"\",\n                    \"\"FieldName\"\": \"\"type\"\",\n                    \"\"Operator\"\": \"\"==\"\",\n                    \"\"Values\"\": [\n                        \"\"'\" & varResourceType & \"'\"\"\n                    ]\n                }\n            ]\"\n        )\n    )\n);\n\n\n\n\n// Initializes the visibility variables used by the overlay and side panes.\n\n    // Sets the overlay visibility to hidden.\n\n        Set(varViewOverlay, false);\n\n    // Sets the columns, filter, and details (quickview) panes to hidden.\n\n        Set(varViewPaneColumns, false);\n        Set(varViewPaneFilter, false);\n        Set(varViewPaneFilterTab, \"Filter\");\n        Set(varFormPaneQuickselect, false);\n\n        Set(varViewModal, false);\n\n\n\n\n\n// Runs the inventory search flow with the default search clause. Parses the JSON returned in the data property into the inventory table type. Stores the parsed result in varInventory. \n\n    Set(\n        varInventoryResponse,\n        'PPAT-SearchInventory'.Run(varResourceClause)\n    );\n\n    Set(\n        varInventory,\n        ParseInventory(varInventoryResponse.data)\n    );\n\n    Set(varInventoryTotalRecords, Value(varInventoryResponse.totalrecords));\n    Set(varInventoryCount, Value(varInventoryResponse.count));\n    Set(varInventoryResultTruncated, varInventoryResponse.resulttruncated);\n\n\n// Replaces the contents of colInventoryColumns with the column configuration defined by nfInventoryColumns\n\n    ClearCollect(\n        colInventoryColumns,\n        nfInventoryColumns\n    );\n\n\n// Create list of operators \n\n    ClearCollect(\n        colInventoryOperators,\n        { DisplayOrder: 1, Operator: \"Equals\", Displayname: \"Equals\", QueryOperator: \"==\", FieldTypes: [\"String\", \"LookUp\"] },\n        { DisplayOrder: 2, Operator: \"DoesNotEqual\", Displayname: \"Does not equal\", QueryOperator: \"!=\", FieldTypes: [\"String\", \"LookUp\"] },\n        { DisplayOrder: 3, Operator: \"Contains\", Displayname: \"Contains\", QueryOperator: \"contains\", FieldTypes: [\"String\", \"LookUp\"] },\n        { DisplayOrder: 4, Operator: \"DoesNotContain\", Displayname: \"Does not contain\", QueryOperator: \"!contains\", FieldTypes: [\"String\", \"LookUp\"] },\n        { DisplayOrder: 5, Operator: \"StartsWith\", Displayname: \"Begins with\", QueryOperator: \"startswith\", FieldTypes: [\"String\", \"LookUp\"] },\n        { DisplayOrder: 6, Operator: \"DoesNotBeginWith\", Displayname: \"Does not begin with\", QueryOperator: \"!startswith\", FieldTypes: [\"String\", \"LookUp\"] },\n        { DisplayOrder: 7, Operator: \"EndsWith\", Displayname: \"Ends with\", QueryOperator: \"endswith\", FieldTypes: [\"String\", \"LookUp\"] },\n        { DisplayOrder: 8, Operator: \"DoesNotEndWith\", Displayname: \"Does not end with\", QueryOperator: \"!endswith\", FieldTypes: [\"String\", \"LookUp\"] },\n        { DisplayOrder: 9, Operator: \"On\", Displayname: \"On\", QueryOperator: \"\", FieldTypes: [\"DateTime\"] },\n        { DisplayOrder: 10, Operator: \"OnOrAfter\", Displayname: \"On or after\", QueryOperator: \"\", FieldTypes: [\"DateTime\"] },\n        { DisplayOrder: 11, Operator: \"OnOrBefore\", Displayname: \"On or before\", QueryOperator: \"\", FieldTypes: [\"DateTime\"] },\n        { DisplayOrder: 12, Operator: \"Yesterday\", Displayname: \"Yesterday\", QueryOperator: \"\", FieldTypes: [\"DateTime\"] },\n        { DisplayOrder: 13, Operator: \"Today\", Displayname: \"Today\", QueryOperator: \"\", FieldTypes: [\"DateTime\"] },\n        { DisplayOrder: 14, Operator: \"Tomorrow\", Displayname: \"Tomorrow\", QueryOperator: \"\", FieldTypes: [\"DateTime\"] }\n    );\n\n\n// Create a filter collection \n\n    ClearCollect( \n        colInventoryFilter,\n        {\n            id: GUID(), \n            field: First(colInventoryColumns),\n            operator: First(colInventoryOperators), \n            value: \"\",\n            enabled: true\n        }\n    );\n\n    Clear(colInventoryFilter);"
    Theme: =PowerAppsTheme
