                                          Set(varSelectedDefault, dgrDatagrid.Selected.id);


                                      Set(
                                          varInventoryDynamic,
                                          ParseJSON(
                                              JSON(
                                                  LookUp(
                                                      nfInventory As resource,
                                                      resource.id = dgrDatagrid.Selected.id
                                                  ),
                                                  JSONFormat.Compact
                                              )
                                          )
                                      );

