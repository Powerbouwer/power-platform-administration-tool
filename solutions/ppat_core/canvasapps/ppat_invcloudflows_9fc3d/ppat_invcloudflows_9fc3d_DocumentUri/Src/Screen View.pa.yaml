Screens:
  Screen View:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - conWrapper_View:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
          Children:
            - conView:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =ColorValue("#fafafa")
                  FillPortions: =3
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =16
                  PaddingLeft: =8
                  PaddingRight: =16
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - conRibbonView:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =48
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - conRibbonButtons_View:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =330
                            Children:
                              - btnRibbonBack_View:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Back"
                                    Appearance: =ButtonAppearance.Subtle
                                    DisplayMode: =DisplayMode.Disabled
                                    Icon: ="ArrowLeft"
                                    Layout: =ButtonLayout.IconOnly
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =2
                                    PaddingLeft: =2
                                    PaddingRight: =2
                                    PaddingTop: =2
                                    Size: =14
                                    Text: ="New"
                                    Tooltip: =AppSettings.pageRibbon.View.back.tooltip
                                    Visible: =AppSettings.pageRibbon.View.back.enabled
                                    Width: =40
                              - recRibbonDivider_View:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(166, 166, 166, 1)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    DisabledFill: =RGBA(166, 166, 166, 1)
                                    Fill: =ColorValue("#d1d1d1")
                                    FocusedBorderColor: =RGBA(0, 120, 212, 1)
                                    Height: =24
                                    HoverFill: =RGBA(0, 120, 212, 1)
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PressedFill: =RGBA(0, 120, 212, 1)
                                    Width: =1
                              - btnRibbonRefresh_View:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Refresh"
                                    Appearance: =ButtonAppearance.Subtle
                                    Icon: ="ArrowClockwise"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =14
                                    Text: ="Refresh"
                                    Tooltip: =AppSettings.pageRibbon.View.refresh.tooltip
                                    Visible: =AppSettings.pageRibbon.View.refresh.enabled
                                    Width: =100
                              - btnRibbonQuickView_View:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Subtle
                                    Icon: ="ArrowCircleRight"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =If ( 
                                          varViewPaneDetails,

                                          Set(varViewPaneDetails, false),

                                          Set(varViewPaneDetails, true)

                                      );
                                    Text: ="Quick View"
                                    Tooltip: =AppSettings.pageRibbon.View.quickview.tooltip
                                    Visible: =AppSettings.pageRibbon.View.quickview.enabled
                                    Width: =124
                              - conRibbonFiller_View:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
