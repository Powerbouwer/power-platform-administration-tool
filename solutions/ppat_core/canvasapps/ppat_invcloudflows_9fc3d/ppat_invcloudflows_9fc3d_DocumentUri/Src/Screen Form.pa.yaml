                              LoadingSpinner: =LoadingSpinner.None
                              OnSelect: |-
                                =//Set(varViewPaneDetails, true);
                                Set(varSelectedItem, galResources_Quickselect.Selected);

                                Set(
                                    varInventoryDynamic,
                                    ParseJSON(
                                        JSON(
                                            LookUp(
                                                nfInventory As resource,
                                                resource.id = galResources_Quickselect.Selected.id
                                            ),
                                            JSONFormat.Compact
                                        )
                                    )
                                );
