App:
  Properties:
    OnStart: "=\r\n// Visibility defaults\r\n\r\n    // Use overlay\r\n        Set(varViewOverlay, false);\r\n\r\n    // Pane visibility\r\n        Set(varViewPaneColumns, false);\r\n        Set(varViewPaneFilter, false);\r\n        Set(varViewPaneDetails, false);\r\n\r\n\r\n\r\n\r\nSet(\r\n    varAppRibbon,\r\n    {\r\n\r\n        view: {\r\n\r\n            back: {\r\n                visible: true, \r\n                tooltip: \"Back\"\r\n            },            \r\n            new: {\r\n                visible: true, \r\n                tooltip: \"Add new record\"\r\n            },\r\n            delete: {\r\n                visible: true, \r\n                tooltip: \"Remove record\"\r\n            },\r\n            refresh: {\r\n                visible: true, \r\n                tooltip: \"Refresh data\"\r\n            },\r\n            details: {\r\n                visible: true, \r\n                tooltip: \"Open details screen\"\r\n            }\r\n\r\n\r\n        },\r\n\r\n        form: {\r\n\r\n            back: {\r\n                visible: true, \r\n                tooltip: \"Back\"\r\n            },            \r\n            new: {\r\n                visible: true, \r\n                tooltip: \"Add new record\"\r\n            },\r\n            delete: {\r\n                visible: true, \r\n                tooltip: \"Remove record\"\r\n            },\r\n            refresh: {\r\n                visible: false, \r\n                tooltip: \"Refresh data\"\r\n            },\r\n            details: {\r\n                visible: false, \r\n                tooltip: \"Open details screen\"\r\n            }\r\n\r\n        }       \r\n            \r\n    }\r\n\r\n);\r\n\r\n\r\n\r\nWith(\r\n    {\r\n        names: \"Nieuwe aanvraag verwerken|Dagelijkse factuurexport|Handmatige klantcontrole|Goedkeuring inkooporder|Welkom nieuwe medewerker|Test Dataverse synchronisatie|Escalatie openstaande cases|Document naar PDF converteren|Synchroniseer verkooporders|API test endpoint|Teams-melding bij incident|Maandelijkse managementrapportage|Concept contractgoedkeuring|Verjaardagsmelding medewerkers|Klantgegevens archiveren|Test e-mailnotificatie|SharePoint-documentgoedkeuring|Controle verlopen contracten|Import testklanten|Planner-taak vanuit e-mail|Verwerk websiteleads|Proof of concept AI-samenvatting|Wekelijkse Teams-samenvatting|Bijwerken voorraadstatus|Ontwikkeltest foutafhandeling|Opslaan e-mailbijlagen|Publiceer goedgekeurde kennisartikelen|Test mobiele pushmelding|Dagelijkse takenherinnering|Nachtelijke gegevensvalidatie\",\r\n        environments: \"D|P|V|P|D|V|P|D|P|V|D|P|V|D|P|V|D|P|V|D|P|V|D|P|V|D|P|V|D|P\",\r\n        creators: \"A|S|M|D|N|M|A|D|S|M|A|S|D|N|S|M|D|S|M|N|A|M|N|S|M|D|A|M|N|S\",\r\n        flowTypes: \"Automated|Scheduled|Instant|Automated|Automated|Scheduled|Scheduled|Instant|Scheduled|Automated|Automated|Scheduled|Automated|Scheduled|Scheduled|Instant|Automated|Scheduled|Instant|Automated|Automated|Instant|Scheduled|Scheduled|Automated|Automated|Automated|Instant|Scheduled|Scheduled\",\r\n        createdTimes: \"2025-01-12T09:15:42Z|2025-02-03T07:00:00Z|2025-03-18T12:44:19Z|2025-04-01T08:30:00Z|2025-04-12T10:00:00Z|2025-05-07T13:20:00Z|2025-05-21T06:00:00Z|2025-06-02T11:35:00Z|2025-06-15T05:30:00Z|2025-07-01T09:10:00Z|2025-07-08T14:00:00Z|2025-08-01T04:00:00Z|2025-08-19T15:20:00Z|2025-09-03T05:00:00Z|2025-09-17T22:00:00Z|2025-10-02T10:30:00Z|2025-10-14T08:45:00Z|2025-11-01T06:30:00Z|2025-11-13T12:00:00Z|2025-12-02T09:15:00Z|2025-12-18T11:20:00Z|2026-01-05T10:00:00Z|2026-01-19T07:00:00Z|2026-02-03T05:15:00Z|2026-02-20T14:20:00Z|2026-03-04T08:00:00Z|2026-03-23T09:45:00Z|2026-04-07T13:30:00Z|2026-04-22T06:45:00Z|2026-05-01T01:00:00Z\",\r\n        modifiedTimes: \"2026-09-20T14:31:08Z|2026-08-15T10:22:54Z|2026-09-25T16:02:11Z|2026-09-21T11:12:00Z|2026-09-10T09:45:00Z|2026-07-14T15:10:00Z|2026-09-26T06:00:00Z|2026-08-30T12:15:00Z|2026-09-24T17:40:00Z|2026-06-01T10:00:00Z|2026-09-22T08:32:00Z|2026-09-01T04:00:00Z|2026-05-18T09:00:00Z|2026-09-03T05:00:00Z|2026-09-17T22:00:00Z|2026-04-22T13:10:00Z|2026-09-14T08:45:00Z|2026-09-27T06:30:00Z|2026-03-02T16:45:00Z|2026-09-23T14:20:00Z|2026-09-26T18:05:00Z|2026-06-12T12:30:00Z|2026-09-21T07:00:00Z|2026-09-27T05:15:00Z|2026-08-20T15:50:00Z|2026-09-26T08:12:00Z|2026-09-20T11:05:00Z|2026-07-07T09:25:00Z|2026-09-27T06:45:00Z|2026-09-27T01:00:00Z\",\r\n        solutions: \"Service Management|Finance Core||Procurement||Integration Development|Service Management||Sales Integration|||Reporting|Legal Development||Data Retention|||Contract Management|Data Migration||Sales Integration|||Inventory Management|Integration Development||Knowledge Management|||Data Quality\",\r\n        connectorSets: \"shared_sharepointonline,shared_office365|shared_commondataserviceforapps,shared_excelonlinebusiness|shared_commondataserviceforapps|shared_approvals,shared_office365|shared_office365users,shared_teams,shared_office365|shared_commondataserviceforapps|shared_commondataserviceforapps,shared_teams|shared_sharepointonline,shared_wordonlinebusiness,shared_onedriveforbusiness|shared_dynamicsax,shared_commondataserviceforapps|shared_http,shared_commondataserviceforapps|shared_commondataserviceforapps,shared_teams|shared_powerbi,shared_office365,shared_sharepointonline|shared_approvals,shared_sharepointonline|shared_office365users,shared_teams|shared_commondataserviceforapps,shared_azureblob|shared_office365|shared_sharepointonline,shared_approvals|shared_commondataserviceforapps,shared_office365|shared_excelonlinebusiness,shared_commondataserviceforapps|shared_office365,shared_planner|shared_http,shared_commondataserviceforapps|shared_openai,shared_sharepointonline|shared_teams,shared_sharepointonline|shared_sql,shared_commondataserviceforapps|shared_http,shared_teams|shared_office365,shared_sharepointonline|shared_commondataserviceforapps,shared_sharepointonline|shared_pushnotification|shared_todo,shared_teams|shared_commondataserviceforapps,shared_teams\"\r\n    },\r\n    ClearCollect(\r\n        colCloudFlows,\r\n        ForAll(\r\n            Sequence(30) As Row,\r\n            With(\r\n                {\r\n                    number: Row.Value,\r\n                    environmentCode: Index(Split(environments, \"|\"), Row.Value).Value,\r\n                    creatorCode: Index(Split(creators, \"|\"), Row.Value).Value,\r\n                    displayName: Index(Split(names, \"|\"), Row.Value).Value,\r\n                    flowType: Index(Split(flowTypes, \"|\"), Row.Value).Value,\r\n                    createdTime: Index(Split(createdTimes, \"|\"), Row.Value).Value,\r\n                    modifiedTime: Index(Split(modifiedTimes, \"|\"), Row.Value).Value,\r\n                    solutionName: Index(Split(solutions, \"|\"), Row.Value).Value,\r\n                    connectorText: Index(Split(connectorSets, \"|\"), Row.Value).Value\r\n                },\r\n                With(\r\n                    {\r\n                        flowId: Text(number, \"00000000\") & \"-aaaa-aaaa-aaaa-aaaaaaaaaaaa\",\r\n                        environmentId: Switch(\r\n                            environmentCode,\r\n                            \"D\", \"Default-11111111-1111-1111-1111-111111111111\",\r\n                            \"P\", \"22222222-2222-2222-2222-222222222222\",\r\n                            \"33333333-3333-3333-3333-333333333333\"\r\n                        ),\r\n                        environmentName: Switch(\r\n                            environmentCode,\r\n                            \"D\", \"Contoso Default\",\r\n                            \"P\", \"Contoso Production\",\r\n                            \"Contoso Development\"\r\n                        ),\r\n                        environmentType: If(\r\n                            environmentCode = \"V\",\r\n                            \"Sandbox\",\r\n                            \"Production\"\r\n                        ),\r\n                        creatorName: Switch(\r\n                            creatorCode,\r\n                            \"A\", \"Alex Wilber\",\r\n                            \"S\", \"Automation Service Account\",\r\n                            \"M\", \"Megan Bowen\",\r\n                            \"D\", \"Adele Vance\",\r\n                            \"Nestor Wilke\"\r\n                        ),\r\n                        creatorEmail: Switch(\r\n                            creatorCode,\r\n                            \"A\", \"alex.wilber@contoso.com\",\r\n                            \"S\", \"svc-powerautomate@contoso.com\",\r\n                            \"M\", \"megan.bowen@contoso.com\",\r\n                            \"D\", \"adele.vance@contoso.com\",\r\n                            \"nestor.wilke@contoso.com\"\r\n                        ),\r\n                        creatorId: Switch(\r\n                            creatorCode,\r\n                            \"A\", \"10000000-0000-0000-0000-000000000001\",\r\n                            \"S\", \"10000000-0000-0000-0000-000000000002\",\r\n                            \"M\", \"10000000-0000-0000-0000-000000000003\",\r\n                            \"D\", \"10000000-0000-0000-0000-000000000004\",\r\n                            \"10000000-0000-0000-0000-000000000005\"\r\n                        )\r\n                    },\r\n                    {\r\n                        id: \"/providers/Microsoft.ProcessSimple/environments/\" &\r\n                            environmentId & \"/flows/\" & flowId,\r\n                        name: flowId,\r\n                        type: \"Microsoft.ProcessSimple/environments/flows\",\r\n                        kind: \"CloudFlow\",\r\n                        location: \"europe\",\r\n                        tenantId: \"11111111-1111-1111-1111-111111111111\",\r\n                        environmentId: environmentId,\r\n                        environmentName: environmentName,\r\n                        environmentRegion: \"europe\",\r\n                        environmentType: environmentType,\r\n                        isManagedEnvironment: environmentCode = \"P\",\r\n                        properties: {\r\n                            displayName: displayName,\r\n                            state: If(\r\n                                number in [3, 13, 19, 25],\r\n                                \"Suspended\",\r\n                                number in [6, 10, 16, 22, 28],\r\n                                \"Stopped\",\r\n                                \"Started\"\r\n                            ),\r\n                            createdTime: createdTime,\r\n                            lastModifiedTime: modifiedTime,\r\n                            creator: {\r\n                                objectId: creatorId,\r\n                                displayName: creatorName,\r\n                                email: creatorEmail,\r\n                                type: \"User\"\r\n                            },\r\n                            flowType: flowType,\r\n                            isSolutionAware:\r\n                                number in [\r\n                                    1, 2, 4, 6, 7, 9, 12, 13,\r\n                                    15, 18, 19, 21, 24, 25, 27, 30\r\n                                ],\r\n                            isManaged: environmentCode = \"P\",\r\n                            solutionName: If(\r\n                                IsBlank(solutionName),\r\n                                Blank(),\r\n                                solutionName\r\n                            ),\r\n                            triggerType: If(\r\n                                flowType = \"Scheduled\",\r\n                                \"Recurrence\",\r\n                                flowType = \"Instant\" ||\r\n                                    number in [10, 21, 25],\r\n                                \"Request\",\r\n                                \"OpenApiConnectionWebhook\"\r\n                            ),\r\n                            connectors: Split(connectorText, \",\")\r\n                        }\r\n                    }\r\n                )\r\n            )\r\n        )\r\n    )\r\n);\r\n\r\nClearCollect( \r\n    colResourceFields, \r\n    { \r\n        FieldId: 1,\r\n        FieldName: \"Evironment Display Name\",\r\n        Operators: \"In, Not in\"\r\n    },\r\n    { \r\n        FieldId: 2,\r\n        FieldName: \"Evironment Region\",\r\n        Operators: \"In, Not in, Contains\"\r\n    }   \r\n);\r\n\r\nClearCollect( \r\n    colFilterSettings, \r\n    { \r\n        row: 0, \r\n        fieldname: \"\",\r\n        operator: \"\",\r\n        value: \"\"\r\n    }\r\n);"
    Theme: =PowerAppsTheme
