extends: conditional
message: "'%s' has no definition."
link: https://learn.microsoft.com/en-us/style-guide/acronyms
level: suggestion
ignorecase: false

first: '\b([A-Z]{3,5})\b'
second: '(?:\b[A-Z][a-z]+ )+\(([A-Z]{3,5})\)'

exceptions:
  - ADR
  - SHA
  - PPAT
  - GUID
  - DLP
  - PCF
  - MDA
  - IAM
  - GHSA
  - PAC
  # The acronyms below are specific for Spectral rules.
  - CAN
  - MDA
  - CFL
  - SOL
  - NAM # Delete after docs are updated
  - GEN # Delete after docs are updated
  # The acronyms below are copied from the Microsoft Style Guide.
  - API
  - ASP
  - CLI
  - CPU
  - CSS
  - CSV
  - DEBUG
  - DOM
  - DPI
  - FAQ
  - GCC
  - GDB
  - GET
  - GPU
  - GTK
  - GUI
  - HTML
  - HTTP
  - HTTPS
  - IDE
  - JAR
