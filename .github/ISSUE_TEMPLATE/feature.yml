name: 💡 Feature / Improvement
description: Propose a new capability or track a concrete improvement to PPAT functionality.
title: "💡 [FEATURE] "
type: feature

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to PPAT.

        Use this form for both initial ideas and defined product development work.
        Describe the problem and desired outcome. Acceptance criteria and technical details can be refined in this issue during discussion.
        At this stage, implementation is handled by the PPAT maintainers to ensure consistency and quality across the project.

  - type: checkboxes
    id: existing-issue-check
    attributes:
      label: Existing request check
      description: Have you checked that this work is not already tracked in the [backlog](https://github.com/Powerbouwer/power-platform-administration-tool/issues)?
      options:
        - label: I have searched the existing issues and confirm that this work is not already tracked.
          required: true

  - type: textarea
    id: audience
    attributes:
      label: Who is this for?
      description: Describe the people or roles that would benefit from this capability.
      placeholder: Describe who has this need and in what context they use PPAT.
    validations:
      required: false

  - type: dropdown
    id: solution
    attributes:
      label: Target solution
      description: Select a solution if applicable. Leave blank for cross-solution work or when not yet determined.
      options:
        - Core
        - Change Viewer
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Problem or reason for change
      description: Describe the problem, use case, or technical reason this product improvement is needed.
      placeholder: |
        Explain the current situation, the goal, and why the existing functionality does not meet this need.
    validations:
      required: true

  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired outcome
      description: Describe the observable behavior or result this work should deliver, without requiring a specific implementation.
      placeholder: |
        Describe what should be different when this work is complete.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Optionally describe how completion will be verified. These criteria can be refined in this issue during discussion.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] ...
    validations:
      required: false

  - type: textarea
    id: ideas-examples
    attributes:
      label: Ideas or examples
      description: Share examples, comparable functionality, or ideas that may help explore the request.
      placeholder: |
        This is optional. You do not need to propose a technical solution.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Describe any workaround, alternative solution, or existing tool you currently use.
      placeholder: Describe how you currently deal with this problem, if applicable.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Technical context and boundaries
      description: Add technical constraints, scope boundaries, design notes, screenshots, links, Microsoft documentation, or APIs where relevant.
      placeholder: Describe relevant technical context, what is included, and what is out of scope.
    validations:
      required: false
