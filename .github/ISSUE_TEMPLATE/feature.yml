name: 💡 Feature request
description: Suggest a new feature or improvement for PPAT.
title: "💡 [FEATURE] "
type: feature

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to PPAT.

        Feature requests help us understand real-world needs and shape the roadmap. 
        At this stage, implementation is handled by the PPAT maintainers to ensure consistency and quality across the project.

  - type: checkboxes
    id: existing-issue-check
    attributes:
      label: Existing request check
      description: Have you checked that this feature has not already been requested in the [backlog](https://github.com/Powerbouwer/power-platform-administration-tool/issues)?
      options:
        - label: I have searched the existing issues and confirm that this feature has not already been requested.
          required: true

  - type: textarea
    id: audience
    attributes:
      label: Who is this for?
      description: Describe the people or roles that would benefit from this capability.
      placeholder: Describe who has this need and in what context they use PPAT.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe what the user is trying to achieve and what currently prevents or complicates it.
      placeholder: |
        Explain the current situation, the goal, and why the existing functionality does not meet this need.
    validations:
      required: true

  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired outcome
      description: Describe what the user should be able to achieve, without prescribing a specific implementation.
      placeholder: |
        Describe the improved outcome from the user's perspective.
    validations:
      required: true

  - type: textarea
    id: ideas-examples
    attributes:
      label: Ideas or examples
      description: Share examples, comparable functionality, or ideas that may help explore the request.
      placeholder: |
        This is optional. You do not need to propose a technical solution.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Describe any workaround, alternative solution, or existing tool you currently use.
      placeholder: Describe how you currently deal with this problem, if applicable.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, screenshots, links, Microsoft documentation, APIs, or other information that may help explain the request.
      placeholder: Add any additional context here.
    validations:
      required: false
