name: 🐞 Bug report
description: Report a reproducible problem with PPAT.
title: "🐞 [BUG] "
type: bug

body:
  - type: checkboxes
    id: existing-issue-check
    attributes:
      label: Existing issue check
      description: Have you checked that this issue has not already been reported in the [backlog](https://github.com/Powerbouwer/power-platform-administration-tool/issues)?
      options:
        - label: I have searched the existing issues and confirm that this bug has not already been reported.
          required: true

  - type: dropdown
    id: solution
    attributes:
      label: Affected solution
      description: Select the solution where the problem occurs.
      options:
        - Core
        - Change Viewer
        - Other / Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Installed version
      description: Enter the full four-part version of the affected solution.
      placeholder: "e.g. 1.0.0.0"
    validations:
      required: true

  - type: textarea
    id: observed-behavior
    attributes:
      label: Observed behavior
      description: Describe what happens, including any visible errors or unexpected results.
      placeholder: Describe what you observe when the problem occurs.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Provide the steps required to reproduce the problem.
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Run ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen instead.
      placeholder: Describe the expected result.
    validations:
      required: true

  - type: dropdown
    id: occurrence
    attributes:
      label: How often does this occur?
      description: Select the option that best describes how reproducible the problem is.
      options:
        - Every time
        - Intermittently
        - Once
        - Not sure
    validations:
      required: true

  - type: upload
    id: attachments
    attributes:
      label: Attachments
      description: Upload screenshots, log files, or other files that help demonstrate the problem.
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Add configuration, environment details, or other context that may help diagnose the problem. Do not include credentials or other sensitive data.
      placeholder: Include relevant configuration, environment details, or other context.
    validations:
      required: false